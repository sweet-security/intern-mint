name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --verbose --all-features
      - name: test
        run: cargo test --verbose --all-features

  test-32bit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: install target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          rustup target add i686-unknown-linux-gnu
      - name: test
        run: cargo test --verbose --all-features --target i686-unknown-linux-gnu
